name: Release firmware

# Builds Sonix Player for the MIPS target, packs it into the firmware image of
# each player, and publishes the two images as a GitHub release:
#
#   r3proii.upt   HiBy R3 Pro II
#   r1.upt        HiBy R1
#
# Pushing a tag such as v1.2.3 does all of it. The file names are the ones the
# player's own "Update firmware > Via internet" looks for in the latest release,
# so they must not change; and the tag has to read as a version (a leading v is
# fine), because that is what the player compares with the one it runs.
#
# Run by hand (Actions > Release firmware > Run workflow) it builds and keeps
# the images as a workflow artifact; tick "release" and give a tag to publish
# them as well.
#
# The stock firmware. The packer rebuilds HiBy's own image, which is not in the
# repository, so the workflow needs both stock files:
#
#   r3proii_original.upt   HiBy R3 Pro II
#   r1_original.upt        HiBy R1
#
# Upload them once, as files of a release tagged "stock-firmware" in this
# repository (a draft or pre-release is fine; it is never picked up by the
# player's updater):
#
#   gh release create stock-firmware --prerelease --title "Stock firmware" \
#       --notes "HiBy's stock images, for the packer" \
#       r3proii_original.upt r1_original.upt
#
# Or, instead, set the secrets STOCK_R3PII_UPT_URL and STOCK_R1_UPT_URL to
# direct links to the files (and optionally STOCK_R3PII_UPT_SHA256 and
# STOCK_R1_UPT_SHA256 to hold the downloads to a checksum).
#
# Optional secrets, for the streaming services (Settings > Secrets and
# variables > Actions):
#
#   STREAMING_KEYS_INI    the contents of streaming-keys.ini
#   STREAMING_KEYS_KEY    the 64 hex characters of streaming-keys.key
#       Without them the images are built with no Tidal, Qobuz, podcast or
#       Last.fm keys: everything else works.
#
# "Build only" compiles the player and stops. It is how to try the workflow, and
# to fill the toolchain cache, before the stock firmware is in place.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release as well as keeping the images"
        type: boolean
        default: false
      tag:
        description: "Tag for the release (needed when releasing), e.g. v1.2.3"
        type: string
        default: ""
      build_only:
        description: "Build the player only: no stock firmware, no images"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  STOCK_R3PII_UPT_URL: ${{ secrets.STOCK_R3PII_UPT_URL }}
  STOCK_R1_UPT_URL: ${{ secrets.STOCK_R1_UPT_URL }}
  STOCK_R3PII_UPT_SHA256: ${{ secrets.STOCK_R3PII_UPT_SHA256 }}
  STOCK_R1_UPT_SHA256: ${{ secrets.STOCK_R1_UPT_SHA256 }}
  STREAMING_KEYS_INI: ${{ secrets.STREAMING_KEYS_INI }}
  STREAMING_KEYS_KEY: ${{ secrets.STREAMING_KEYS_KEY }}

jobs:
  firmware:
    runs-on: ubuntu-22.04
    # The first run compiles a MIPS cross toolchain from source, which takes
    # well over an hour; later runs restore it from the cache.
    timeout-minutes: 300

    steps:
      - name: Work out the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            release=true
          else
            tag="$INPUT_TAG"
            release="$INPUT_RELEASE"
          fi
          if [ "$release" = "true" ] && [ -z "$tag" ]; then
            echo "::error::Releasing needs a tag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the changelog

      # Before the long build, so a missing file fails in seconds and not after
      # an hour.
      - name: Fetch the stock firmware
        if: ${{ !inputs.build_only }}
        working-directory: sonix-packer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch() {
            file="$1"; url="$2"; want="$3"
            if gh release download stock-firmware --repo "$GITHUB_REPOSITORY" --pattern "$file" --output "$file" 2>/dev/null; then
              echo "$file: from the stock-firmware release"
            elif [ -n "$url" ]; then
              curl --fail --location --retry 3 --silent --show-error -o "$file" "$url"
              echo "$file: from the download link"
            else
              echo "::error::No $file: upload it to a release tagged stock-firmware, or set the secret with its download link. See the top of this workflow."
              return 1
            fi
            if [ -n "$want" ]; then
              echo "$want  $file" | sha256sum --check -
            fi
          }
          ok=0
          fetch r3proii_original.upt "$STOCK_R3PII_UPT_URL" "$STOCK_R3PII_UPT_SHA256" || ok=1
          fetch r1_original.upt "$STOCK_R1_UPT_URL" "$STOCK_R1_UPT_SHA256" || ok=1
          exit $ok

      - name: Install the build and packing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget curl ca-certificates pkg-config python3 perl \
            texinfo bison flex patch xz-utils bzip2 unzip autoconf automake libtool libtool-bin gzip \
            gettext autopoint gtk-doc-tools libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev libncurses-dev \
            p7zip-full squashfs-tools genisoimage

      # The toolchain and the static libraries are the slow part and change only
      # when the Makefile or the toolchain scripts do. This cache is written only
      # when the whole job succeeds.
      - name: Restore the toolchain and libraries
        id: libs
        uses: actions/cache@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/freetype-target
            sonix-player/audio-target
            sonix-player/*.tar.gz
            sonix-player/*.tar.bz2
            sonix-player/*.tar.xz
          key: target-libs-${{ runner.os }}-${{ hashFiles('sonix-player/Makefile', 'sonix-player/rockboxdev/**') }}

      # The compiler itself takes an hour; the libraries after it take minutes
      # and are where a missing package shows up. So progress is kept even when
      # the build fails, and the next run carries on from the libraries instead
      # of compiling the compiler again.
      - name: Restore the unfinished toolchain
        if: ${{ steps.libs.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/tmp
          key: toolchain-partial-${{ runner.os }}-${{ hashFiles('sonix-player/rockboxdev/**') }}-${{ github.run_id }}
          restore-keys: |
            toolchain-partial-${{ runner.os }}-${{ hashFiles('sonix-player/rockboxdev/**') }}-

      - name: Build the toolchain
        id: toolchain
        if: ${{ steps.libs.outputs.cache-hit != 'true' }}
        working-directory: sonix-player
        run: |
          # The compiler is finished once the C++ runtime of the second stage is
          # in place; what comes after (alsa-lib and on) can be started over.
          if [ -x rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-gcc ] && [ -d tmp ] &&
             find rockbox-toolchain -name 'libstdc++.so*' | grep -q .; then
            echo "Carrying on from the libraries."
            RBDEV_RESTART=alsa-lib ./rockboxdev/rockboxdev.sh
          else
            ./rockboxdev/rockboxdev.sh
          fi

      - name: Keep the unfinished toolchain
        if: ${{ always() && steps.libs.outputs.cache-hit != 'true' && steps.toolchain.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: |
            sonix-player/rockbox-toolchain
            sonix-player/tmp
          key: toolchain-partial-${{ runner.os }}-${{ hashFiles('sonix-player/rockboxdev/**') }}-${{ github.run_id }}

      - name: Keep the toolchain logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-logs
          path: sonix-player/tmp/rbdev-build/*.log
          if-no-files-found: ignore

      - name: Streaming keys
        if: ${{ env.STREAMING_KEYS_INI != '' && env.STREAMING_KEYS_KEY != '' }}
        working-directory: sonix-player
        run: |
          umask 077
          printf '%s\n' "$STREAMING_KEYS_INI" > streaming-keys.ini
          printf '%s\n' "$STREAMING_KEYS_KEY" > streaming-keys.key
          python3 tools/seal_streamkeys.py seal
          rm -f streaming-keys.ini

      - name: No streaming keys
        if: ${{ env.STREAMING_KEYS_INI == '' || env.STREAMING_KEYS_KEY == '' }}
        run: |
          echo "::warning::STREAMING_KEYS_INI / STREAMING_KEYS_KEY are not set, so the images have no Tidal, Qobuz, podcast or Last.fm keys."

      - name: Build the player for the target
        working-directory: sonix-player
        run: make target -j"$(nproc)"

      - name: Pack the firmware images
        if: ${{ !inputs.build_only }}
        working-directory: sonix-packer
        run: |
          cp ../sonix-player/sonix_player ../sonix-player/sonix_launch .
          bash ./sonix_firmware_packer.sh
          for image in r3proii.upt r1.upt; do
            test -s "$image" || { echo "::error::$image was not built."; exit 1; }
          done
          sha256sum r3proii.upt r1.upt | tee SHA256SUMS

      - name: Keep the images
        if: ${{ !inputs.build_only }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            sonix-packer/r3proii.upt
            sonix-packer/r1.upt
            sonix-packer/SHA256SUMS
          if-no-files-found: error

      # The release says what changed: the section of CHANGELOG.md for this tag,
      # or, if there is none, the commit subjects since the previous tag.
      - name: Write the release notes
        if: ${{ steps.tag.outputs.release == 'true' && !inputs.build_only }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          awk -v tag="$TAG" 'index($0, "## " tag) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md \
            | sed '/./,$!d' > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::warning::CHANGELOG.md has no '## $TAG' section, so the notes list the commits instead."
            prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            { echo "Changes since ${prev:-the start}:"; echo; git log --no-merges --format='- %s' "${prev:+$prev..}$TAG"; } > "$notes"
          fi
          {
            echo
            echo "**Flashing:** \`r1.upt\` is for the HiBy R1 and \`r3proii.upt\` for the R3 Pro II. Never the other one."
            echo "Charge the player above 30% first. \`SHA256SUMS\` has the checksums."
          } >> "$notes"
          cat "$notes"

      - name: Publish the release
        if: ${{ steps.tag.outputs.release == 'true' && !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          cd sonix-packer
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run for a tag that already has a release: replace its files.
            gh release upload "$TAG" r3proii.upt r1.upt SHA256SUMS --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" r3proii.upt r1.upt SHA256SUMS \
              --title "Sonix Player $TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --target "$GITHUB_SHA"
          fi
